{% extends "base.html" %}
{% block titulo %}Entrar · Cafetería Kiuvo{% endblock %}
{% block contenido %}
<form method="post" class="panel angosto">
  <h1>Iniciar sesión</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" required autofocus></label>
  <label>Contraseña <input type="password" name="password" required></label>
  <button class="boton">Entrar</button>
  <p class="suave">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Créala aquí</a>.</p>
</form>
{% endblock %}
