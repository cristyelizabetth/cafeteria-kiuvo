{% extends "base.html" %}
{% block titulo %}Crear cuenta · Cafetería Kiuvo{% endblock %}
{% block contenido %}
<form method="post" class="panel angosto">
  <h1>Crear cuenta</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nombre <input type="text" name="nombre" required autofocus></label>
  <label>Correo <input type="email" name="email" required></label>
  <label>Contraseña (mínimo 6 caracteres) <input type="password" name="password" minlength="6" required></label>
  <button class="boton">Registrarme</button>
  <p class="suave">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>.</p>
</form>
{% endblock %}
